models:
  embeddings:
    default:
      provider: sentence_transformers
      model: BAAI/bge-small-en-v1.5
      dimension: 384
      normalize: true
  rerankers:
    default:
      provider: sentence_transformers
      model: cross-encoder/ms-marco-MiniLM-L-6-v2
  generators:
    default:
      provider: anthropic
      model: claude-opus-5
      effort: medium
      temperature: 0
      max_tokens: 1024
    budget:
      provider: anthropic
      model: claude-haiku-4-5
      temperature: 0
      max_tokens: 1024
    openai:
      provider: openai
      model: ${OPENAI_MODEL}
      temperature: 0
      max_tokens: 1024
  judges:
    default:
      provider: anthropic
      model: claude-opus-5
      effort: high
      temperature: 0
      max_tokens: 2048
    secondary:
      provider: anthropic
      model: claude-sonnet-5
      effort: high
      temperature: 0
      max_tokens: 2048
