[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ragops"
version = "0.1.0"
description = "Evaluation and observability platform for retrieval-augmented generation systems."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "bm25s>=0.2,<1",
    "fastapi>=0.115,<1",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
    "opentelemetry-exporter-prometheus>=0.65b0,<1",
    "opentelemetry-instrumentation-fastapi>=0.65b0,<1",
    "opentelemetry-sdk>=1.44,<2",
    "pgvector>=0.4,<1",
    "prometheus-client>=0.23,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pyyaml>=6,<7",
    "sentence-transformers>=5,<6",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.21,<1",
    "httpx>=0.28,<1",
    "mypy>=1.14,<2",
    "pre-commit>=4,<5",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
    "types-pyyaml>=6,<7",
]

[project.scripts]
ragops = "ragops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ragops = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
markers = [
    "integration: tests that require external services",
    "regression: tests that enforce committed quality baselines",
]

[tool.coverage.run]
branch = true
source = ["ragops"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["ragops"]
